<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>陽人の育児記録</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#202633;--muted:#687386;--line:#e5e9f0;--blue:#3767d6;--soft:#edf3ff;--red:#b83b45}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
header{padding:24px 18px 18px;background:linear-gradient(135deg,#eaf1ff,#f8faff)}h1{font-size:23px;margin:0 0 5px}header p{margin:0;color:var(--muted);font-size:13px}
main{max-width:680px;margin:auto;padding:14px 14px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:0 2px 8px #1b2b4a08}
h2{font-size:16px;margin:0 0 13px}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.type{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 5px;font-size:14px;font-weight:650;color:var(--ink)}.type.active{background:var(--soft);border-color:var(--blue);color:var(--blue)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid #d9dfe8;border-radius:10px;background:#fff;color:var(--ink)}textarea{min-height:76px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;border:0;border-radius:12px;background:var(--blue);color:white;font-size:16px;font-weight:700;padding:14px;margin-top:14px}.secondary{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:13px}
.entry{border-top:1px solid var(--line);padding:13px 0}.entry:first-child{border-top:0}.entrytop{display:flex;justify-content:space-between;gap:8px}.entrytitle{font-weight:700}.time{font-size:12px;color:var(--muted);white-space:nowrap}.detail{font-size:14px;margin-top:5px;white-space:pre-wrap}.actions{display:flex;gap:7px;margin-top:8px}.actions button{font-size:12px;padding:6px 10px}.empty{color:var(--muted);font-size:14px;padding:12px 0}.tools{display:flex;flex-wrap:wrap;gap:8px}.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 0 0}.danger{color:var(--red)}.filter{display:flex;gap:8px;align-items:center}.filter input{flex:1}
</style>
</head>
<body>
<header><h1>陽人の育児記録</h1><p>毎日のミルク・おむつ・お世話を、かんたんに記録</p></header>
<main>
<section class="card">
<h2 id="formTitle">記録を追加</h2>
<div class="types" id="types">
<button class="type active" data-type="ミルク">🍼 ミルク</button>
<button class="type" data-type="おむつ">👶 おむつ</button>
<button class="type" data-type="睡眠">🌙 睡眠</button>
<button class="type" data-type="お世話">🤱 お世話</button>
<button class="type" data-type="外出">🚶 外出</button>
<button class="type" data-type="メモ">📝 メモ</button>
</div>
<div class="row">
<div><label for="when">日時</label><input id="when" type="datetime-local"></div>
<div><label for="person">記録した人・担当</label><select id="person"><option>父</option><option>母</option><option>その他</option></select></div>
</div>
<div id="extra"></div>
<label for="note">メモ（任意）</label><textarea id="note" placeholder="気づいたことなど"></textarea>
<button class="primary" id="save">記録を保存</button>
<button class="secondary" id="cancel" style="display:none;margin-top:8px;width:100%">編集をやめる</button>
<p class="hint">記録はこのiPhoneのブラウザ内に保存されます。機種変更・Safariのデータ消去に備えて、定期的にバックアップしてください。</p>
</section>
<section class="card">
<h2>記録一覧</h2>
<div class="filter"><input type="date" id="filterDate"><button class="secondary" id="clearFilter">全期間</button></div>
<div id="entries"></div>
</section>
<section class="card">
<h2>バックアップ・復元</h2>
<div class="tools"><button class="secondary" id="backup">バックアップを書き出す</button><button class="secondary" id="restore">バックアップを読み込む</button><input id="file" type="file" accept="application/json,.json" hidden></div>
<p class="hint">バックアップはJSONファイルで保存できます。読み込むと現在の記録に追加されます。同じ記録がある場合は重複を避けます。</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const KEY='haruto-care-records-v1';
let records=[];let selected='ミルク';let editing=null;
try{records=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(records))records=[]}catch(e){records=[]}
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
$('when').value=nowLocal();
const fields={
'ミルク':'<label>量（ml）</label><input id="amount" type="number" min="0" inputmode="numeric" placeholder="例：120">',
'おむつ':'<label>種類</label><select id="kind"><option>おしっこ</option><option>うんち</option><option>おしっこ・うんち</option></select>',
'睡眠':'<div class="row"><div><label>寝た時刻</label><input id="sleepStart" type="time"></div><div><label>起きた時刻</label><input id="sleepEnd" type="time"></div></div>',
'お世話':'<label>内容</label><input id="activity" placeholder="例：抱っこ、入浴、着替え">',
'外出':'<label>内容</label><input id="activity" placeholder="例：母が外出、父とお留守番">',
'メモ':'<label>タイトル（任意）</label><input id="activity" placeholder="例：機嫌・体調など">'
};
function renderExtra(data={}){$('extra').innerHTML=fields[selected]||'';if(data.amount!=null&&$('amount'))$('amount').value=data.amount;if(data.kind&&$('kind'))$('kind').value=data.kind;if(data.sleepStart&&$('sleepStart'))$('sleepStart').value=data.sleepStart;if(data.sleepEnd&&$('sleepEnd'))$('sleepEnd').value=data.sleepEnd;if(data.activity&&$('activity'))$('activity').value=data.activity}
function setType(t){selected=t;document.querySelectorAll('.type').forEach(b=>b.classList.toggle('active',b.dataset.type===t));renderExtra()}
document.querySelectorAll('.type').forEach(b=>b.addEventListener('click',()=>setType(b.dataset.type)));renderExtra();
function persist(){localStorage.setItem(KEY,JSON.stringify(records));draw()}
function detail(r){let a=[];if(r.amount!==undefined&&r.amount!=='')a.push(r.amount+' ml');if(r.kind)a.push(r.kind);if(r.sleepStart||r.sleepEnd)a.push((r.sleepStart||'')+' ～ '+(r.sleepEnd||''));if(r.activity)a.push(r.activity);if(r.note)a.push(r.note);return a.join(' ／ ')}
function draw(){const date=$('filterDate').value;let list=[...records].filter(r=>!date||r.when.slice(0,10)===date).sort((a,b)=>b.when.localeCompare(a.when));$('entries').innerHTML=list.length?list.map(r=>`<div class="entry"><div class="entrytop"><div class="entrytitle">${esc(r.type)}・${esc(r.person)}</div><div class="time">${new Date(r.when).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div><div class="detail">${esc(detail(r))}</div><div class="actions"><button class="secondary" data-edit="${r.id}">編集</button><button class="secondary danger" data-del="${r.id}">削除</button></div></div>`).join(''):'<div class="empty">まだ記録がありません。</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('save').onclick=()=>{const when=$('when').value;if(!when){alert('日時を入力してください');return}const r={id:editing||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())),type:selected,when,person:$('person').value,note:$('note').value.trim(),updatedAt:new Date().toISOString()};if($('amount'))r.amount=$('amount').value;if($('kind'))r.kind=$('kind').value;if($('sleepStart'))r.sleepStart=$('sleepStart').value;if($('sleepEnd'))r.sleepEnd=$('sleepEnd').value;if($('activity'))r.activity=$('activity').value.trim();if(editing){const i=records.findIndex(x=>x.id===editing);if(i>=0)records[i]=r}else{r.createdAt=new Date().toISOString();records.push(r)}persist();resetForm()};
function resetForm(){editing=null;$('formTitle').textContent='記録を追加';$('save').textContent='記録を保存';$('cancel').style.display='none';$('when').value=nowLocal();$('person').value='父';$('note').value='';setType('ミルク')}
$('cancel').onclick=resetForm;
$('entries').onclick=e=>{const id=e.target.dataset.edit||e.target.dataset.del;if(!id)return;const r=records.find(x=>x.id===id);if(!r)return;if(e.target.dataset.edit){editing=id;selected=r.type;$('formTitle').textContent='記録を編集';$('save').textContent='変更を保存';$('cancel').style.display='block';setType(selected);$('when').value=r.when;$('person').value=r.person;$('note').value=r.note||'';renderExtra(r);window.scrollTo({top:0,behavior:'smooth'})}else if(confirm('この記録を削除しますか？')){records=records.filter(x=>x.id!==id);persist()}};
$('filterDate').onchange=draw;$('clearFilter').onclick=()=>{$('filterDate').value='';draw()};
$('backup').onclick=()=>{const blob=new Blob([JSON.stringify({app:'陽人の育児記録',version:1,exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='陽人の育児記録バックアップ_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('restore').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const incoming=Array.isArray(data)?data:data.records;if(!Array.isArray(incoming))throw Error();const ids=new Set(records.map(r=>r.id));let added=0;incoming.forEach(r=>{if(r&&r.id&&!ids.has(r.id)){records.push(r);ids.add(r.id);added++}});persist();alert(added+'件の記録を追加しました')}catch(err){alert('バックアップファイルを読み込めませんでした')}e.target.value=''};
draw();
</script>
</body></html>
